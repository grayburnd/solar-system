name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
env:
  MONGO_URI: ${{ vars.MONGO_URI }}
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
    
jobs:
    unit-testing:
        services:
          mongodb-service:
            image: siddharth67/mongo-db:non-prod
            ports:
              - 27017:27017
        env:
          MONGO_URI: mongodb//localhost:27017/superData ## To make dynamic
          MONGO_USERNAME: non-prod-user ## To make dynamic
          MONGO_PASSWORD: non-prod-password ## To make dynamic
        strategy:
          matrix:
            nodejs_version: [20, 23]
            operating_system: [ubuntu-latest]
            exclude:
              - nodejs_version: 23
                operating_system: macos-latest
        runs-on: ${{ matrix.operating_system }}
        steps:

        - name: Checkout Repository
          uses: actions/checkout@v6

        - name: Setup NodeJS Version
          uses: actions/setup-node@v6
          with:
            node-version: ${{ matrix.nodejs_version }}
            
        - name: Cache NPM dependencies
          uses: actions/cache@v5
          with:
            path: node_modules
            key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json')}}

        - name: Install Dependencies
          run: npm install
    
        - name: Unit Testing
          run: npm test
          
        - name: Archive Test Result
          if: ${{ always() }}
          uses: actions/upload-artifact@v7
          with:
            name: Mocha-Test-Result-${{ matrix.nodejs_version }}-${{ matrix.operating_system }}
            path: test-results.xml

    code-coverage:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v6

        - name: Setup NodeJS Version
          uses: actions/setup-node@v6
          with:
            node-version: 20

        - name: Cache NPM dependencies
          uses: actions/cache@v5
          with:
            path: node_modules
            key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json')}}
    
        - name: Install Dependencies
          run: npm install
    
        - name: Code Coverage
          continue-on-error: true
          run: npm run coverage
          
        - name: Archive Test Result
          # if: ${{ always() }}
          uses: actions/upload-artifact@v7
          with:
            name: Code-Coverage-Result
            path: ./coverage
            # retention-days: 5 ## Optional retention

    docker:
        runs-on: ubuntu-latest
        permissions:
          packages: write
        needs: [unit-testing, code-coverage]
        steps:
          - name: Checkout Repository
            uses: actions/checkout@v6
            
          - name: Login to Docker Hub
            uses: docker/login-action@v4
            with:
              username: ${{ vars.DOCKERHUB_USERNAME }}
              password: ${{ secrets.DOCKERHUB_TOKEN }}

          - name: Login to GitHub Container Registry
            uses: docker/login-action@v4
            with:
              registry: ghcr.io
              username: ${{ github.repository_owner }}
              password: ${{ secrets.GITHUB_TOKEN }}

          - name: Build
            uses: docker/build-push-action@v7
            with:
              context: .
              push: false
              tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

              ### Should have testing here

          - name: GitHub Container Registry Push
            uses: docker/build-push-action@v7
            with:
              context: .
              push: true
              tags: |
                ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
                ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}